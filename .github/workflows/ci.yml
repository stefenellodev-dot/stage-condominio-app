name: CI

on:
  push:
    branches: [main, hardening/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev

  # Nota: `jobs.<job_id>.if` no admite el contexto `secrets` (solo
  # github, needs, vars, inputs); usarlo produce un startup failure del
  # workflow. La condición se evalúa a nivel de paso vía `env`.
  rls:
    runs-on: ubuntu-latest
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run RLS suite
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f tests/rls/rls-tests.sql
